<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial;
      background-color: #f4f4f4;
      color: #222222;
      padding: 20px;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #0066cc;
      color: white;
      padding: 14px 18px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .logo { font-weight: bold; font-size: 18px; }
    .links { display: flex; gap: 15px; }
    .links a { color: white; text-decoration: none; font-size: 14px; }
    .card {
      background-color: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    h1 { color: #0066cc; margin-bottom: 12px; font-size: 24px; }
    p { line-height: 1.6; margin-bottom: 12px; }
  </style>
</head>
<body>

  <div class="navbar">
    <div class="logo">MySite</div>
    <div class="links">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
    </div>
  </div>

  <div class="card">
    <h1>Welcome to my website</h1>
    <p>I built this on my phone. It's live on the internet.</p>
    <p>Use the links above to explore.</p>
  </div>

</body>
</html>
